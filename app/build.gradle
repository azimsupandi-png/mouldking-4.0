plugins {
    id 'com.android.application'
}

// Release signing: CI secrets if present, otherwise the project keystore in /keystore.
def ksFile = file(System.getenv('MK6_KEYSTORE') ?: "${rootDir}/keystore/mk6-release.jks")
def ksPass = System.getenv('MK6_KEYSTORE_PASSWORD') ?: 'mk6console'
def ksAlias = System.getenv('MK6_KEY_ALIAS') ?: 'mk6'
def ksKeyPass = System.getenv('MK6_KEY_PASSWORD') ?: ksPass

android {
    namespace 'com.azimsupandi.mk6console'
    compileSdk 35

    defaultConfig {
        applicationId 'com.azimsupandi.mk6console.mk4test'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger() + 300)
        versionName '1.3'
        buildConfigField 'String', 'BUILD_DATE', "\"${java.time.LocalDate.now()}\""
    }

    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

// app.js is built from the parts in src/main/js (one closure split into readable pieces)
tasks.register('joinAppJs') {
    def parts = fileTree('src/main/js') { include '*.js' }
    def out = file('src/main/assets/app.js')
    inputs.files(parts)
    outputs.file(out)
    doLast {
        def text = parts.files.sort { it.name }.collect { it.getText('UTF-8') }.join('')
        if (!out.exists() || out.getText('UTF-8') != text) out.write(text, 'UTF-8')
    }
}
preBuild.dependsOn('joinAppJs')
