name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Safety watchdog + BLE advertiser tests (JVM, stubbed Android)
        run: |
          mkdir -p build/jvmtest
          javac -d build/jvmtest $(find tests/jvm -name '*.java') \
            app/src/main/java/com/azimsupandi/mk6console/Mk6Advertiser.java \
            app/src/main/java/com/azimsupandi/mk6console/Mk6Crypt.java
          java -cp build/jvmtest com.azimsupandi.mk6console.Mk6AdvertiserTest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: UI tests (fake Android bridge - clicks, hold, idle, graphics, sharing, 360 px)
        run: python tests/ui/test_ui.py

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      RT: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MK6-Console.apk
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: MK6-Console-apk
          path: out/MK6-Console.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/MK6-Console.apk \
            --title "MK6 Console (build ${{ github.run_number }})" \
            --notes "Automatic build from ${{ github.sha }}" \
            --target ${{ github.sha }}

      # The code repo is private, so the app checks for updates in a public repo that only holds the APK.
      # Needs the secret RELEASES_TOKEN (fine-grained token, Contents: read and write on mk6-console-releases).
      - name: Publish to the public releases repo
        if: env.RT != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          R: azimsupandi-png/mk6-console-releases
        run: |
          # an empty repo has no commit to tag, so give it a README first
          if ! gh api repos/$R/contents/README.md >/dev/null 2>&1; then
            printf '# MK6 Console releases\n\nAPK builds of MK6 Console. Download the newest from Releases.\n' | base64 -w0 > readme.b64
            gh api -X PUT repos/$R/contents/README.md -f message="Add README" -f content="$(cat readme.b64)"
          fi
          # release notes = this commit's message without the attribution lines
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release delete latest -R $R --yes --cleanup-tag || true
          gh release create latest out/MK6-Console.apk -R $R \
            --title "MK6 Console (build ${{ github.run_number }})" \
            --notes-file notes.txt
