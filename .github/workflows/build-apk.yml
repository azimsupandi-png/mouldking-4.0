name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Safety watchdog + BLE advertiser tests (JVM, stubbed Android)
        run: |
          mkdir -p build/jvmtest
          javac -d build/jvmtest $(find tests/jvm -name '*.java') \
            app/src/main/java/com/azimsupandi/mk6console/Mk6Advertiser.java \
            app/src/main/java/com/azimsupandi/mk6console/Mk6Crypt.java
          java -cp build/jvmtest com.azimsupandi.mk6console.Mk6AdvertiserTest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: UI tests (fake Android bridge, clicks, hold, idle, 360 px)
        run: python tests/ui/test_ui.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MK6-Console.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MK6-Console-apk
          path: out/MK6-Console.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/MK6-Console.apk \
            --title "MK6 Console (build ${{ github.run_number }})" \
            --notes "Automatic build from ${{ github.sha }}" \
            --target ${{ github.sha }}
